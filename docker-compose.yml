services:
  api:
    build: .
    image: lab-sample-check:1.0.0
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
